---
name: Orbit release count verification
on:
  push:
    branches: [ci/orbit-live-counts]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Count freshly fetched vendor releases
        env:
          TZ: Europe/Kyiv
        run: |
          set -Eeuo pipefail
          node deploy/snapshot_releases.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const snapshot = JSON.parse(readFileSync('src/data/releases.json', 'utf8'));
          const now = Date.now();
          const midnight = new Date(now);
          midnight.setHours(0, 0, 0, 0);
          const starts = [midnight.getTime(), ...[7, 14, 30, 182].map(days => now - days * 86400000)];
          const counts = starts.map(start => snapshot.releases.filter(row => {
            const date = Date.parse(row.date);
            return date >= start && date <= now;
          }).length);
          console.log('Orbit counts (today, 7d, 14d, 30d, 26w): ' + JSON.stringify(counts));
          console.log('Checked at: ' + new Date(now).toLocaleString('en-US', { timeZoneName: 'short' }));
          NODE
