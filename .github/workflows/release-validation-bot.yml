---
name: Release validation bot

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-validation-bot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
      candidate: ${{ steps.generate.outputs.candidate }}
      result_version: ${{ steps.generate.outputs.result_version }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Record exact source
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh and validate vendor data
        id: generate
        run: |
          set -Eeuo pipefail
          before="$RUNNER_TEMP/before"
          mkdir -p "$before"
          cp src/data/releases.json src/data/security.json "$before/"
          token=$(uuidgen)
          echo "::stop-commands::$token"
          node deploy/snapshot_releases.mjs
          node deploy/snapshot_security.mjs
          node deploy/refresh_bot.mjs "$before" "$RUNNER_TEMP/candidate" >> "$GITHUB_OUTPUT"
          node --test 'tests/*.test.mjs'
          python3 scripts/check_results.py
          echo "::$token::"
      - name: Preserve data candidate
        if: steps.generate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: snapshot-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 3

  prepare:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      branch: ${{ steps.candidate.outputs.branch }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: snapshot-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Prepare the snapshot candidate branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
          CANDIDATE: ${{ needs.refresh.outputs.candidate }}
          RESULT_VERSION: ${{ needs.refresh.outputs.result_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$CANDIDATE" =~ ^[a-f0-9]{24}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          branch="chore/snapshot-$CANDIDATE"
          # One open bot proposal at a time. A closed identical proposal is not regenerated.
          open=$(gh pr list --base dev --state open --limit 100 --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and (.headRefName | startswith("chore/snapshot-")))] | length')
          if [[ "$open" != 0 ]]; then
            echo "An existing snapshot proposal needs review."
            exit 0
          fi
          seen=$(gh pr list --state all --head "$branch" --limit 100 --json isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)] | length')
          if [[ "$seen" != 0 ]]; then
            echo "This exact candidate already has a review decision."
            exit 0
          fi
          # The workflow token may lack permission to read repository Actions settings.
          capability=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
            --jq '.can_approve_pull_request_reviews | if type == "boolean" then tostring else "unknown" end' \
            2>/dev/null) || capability=unknown
          if [[ "$capability" == false ]]; then
            echo "::error::Enable GitHub Actions to create and approve pull requests before running the bot."
            exit 1
          elif [[ "$capability" != true ]]; then
            echo "::notice::Actions pull request capability could not be read. PR creation will check permission."
          fi

          source="$RUNNER_TEMP/candidate"
          paths=(src/data/releases.json src/data/security.json)
          cp "$source/releases.json" "${paths[0]}"
          cp "$source/security.json" "${paths[1]}"
          if [[ -n "$RESULT_VERSION" ]]; then
            [[ "$RESULT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
            dir=results/mikrotik/RouterOS
            mkdir -p "$dir"
            [[ ! -e "$dir/$RESULT_VERSION.json" && ! -e "$dir/$RESULT_VERSION" ]]
            cp "$source/result.json" "$dir/$RESULT_VERSION.json"
            paths+=("$dir/$RESULT_VERSION.json")
          fi
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then exit 0; fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote_git() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git "$@"
          }
          remote_sha() {
            remote_git ls-remote origin "$1" | cut -f1
          }
          ref="refs/heads/$branch"
          [[ "$(remote_sha refs/heads/dev)" == "$BASE_SHA" ]]
          tip=$(remote_sha "$ref")
          if [[ -n "$tip" ]]; then
            # Inspect objects without checking out or executing anything from the remote branch.
            remote_git fetch --no-tags --depth=2 origin "$ref"
            [[ "$(git rev-parse FETCH_HEAD)" == "$tip" ]]
            [[ "$(git rev-list --parents -n 1 "$tip")" == "$tip $BASE_SHA" ]]
            node deploy/verify_snapshot_candidate.mjs "$(git write-tree)" "$tip" "${paths[@]}"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh release and security snapshots'
            tip=$(git rev-parse HEAD)
            [[ "$(remote_sha refs/heads/dev)" == "$BASE_SHA" ]]
            remote_git push origin "HEAD:$ref"
          fi
          [[ "$(remote_sha refs/heads/dev)" == "$BASE_SHA" && "$(remote_sha "$ref")" == "$tip" ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      ci: ${{ steps.runs.outputs.ci }}
      security: ${{ steps.runs.outputs.security }}
    steps:
      - name: Dispatch validation of the candidate branch
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -Eeuo pipefail
          [[ "$BRANCH" =~ ^chore/snapshot-[a-f0-9]{24}$ ]]
          for workflow in ci security; do
            id=$(gh api --method POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GH_REPO/actions/workflows/$workflow.yml/dispatches" \
              -f "ref=$BRANCH" --jq '.workflow_run_id')
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            echo "$workflow=$id" >> "$GITHUB_OUTPUT"
          done

  validate:
    needs: [prepare, dispatch]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Require successful CI and Security on the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          CI_RUN: ${{ needs.dispatch.outputs.ci }}
          SECURITY_RUN: ${{ needs.dispatch.outputs.security }}
        run: |
          set -Eeuo pipefail
          [[ "$BRANCH" =~ ^chore/snapshot-[a-f0-9]{24}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN" =~ ^[1-9][0-9]*$ && "$SECURITY_RUN" =~ ^[1-9][0-9]*$ ]]
          for ((attempt = 0; attempt < 90; attempt++)); do
            pending=0
            for workflow in ci security; do
              run_id=$CI_RUN
              if [[ "$workflow" == security ]]; then run_id=$SECURITY_RUN; fi
              state=$(gh api "repos/$GH_REPO/actions/runs/$run_id" | jq -er \
                --arg path ".github/workflows/$workflow.yml" --arg branch "$BRANCH" --arg sha "$HEAD_SHA" '
                  if .path != $path or .event != "workflow_dispatch" or .head_branch != $branch or .head_sha != $sha
                  then error("validation run does not match the candidate")
                  elif .status != "completed" then "pending"
                  else .conclusion
                  end')
              case "$state" in
                success) ;;
                pending) pending=1 ;;
                *) echo "::error::$workflow run $run_id concluded $state"; exit 1 ;;
              esac
            done
            if [[ "$pending" == 0 ]]; then exit 0; fi
            sleep 20
          done
          echo "::error::CI or Security did not finish within 30 minutes"
          exit 1

  propose:
    needs: [refresh, prepare, dispatch, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open the validated snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
          CI_RUN: ${{ needs.dispatch.outputs.ci }}
          SECURITY_RUN: ${{ needs.dispatch.outputs.security }}
        run: |
          set -Eeuo pipefail
          [[ "$BRANCH" =~ ^chore/snapshot-[a-f0-9]{24}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN" =~ ^[1-9][0-9]*$ && "$SECURITY_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq .object.sha)" == "$BASE_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)" == "$HEAD_SHA" ]]
          gh pr create --base dev --head "$BRANCH" \
            --title 'Refresh release and security snapshots' \
            --body "Daily vendor refresh. Candidate: $HEAD_SHA.
          CI: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$CI_RUN
          Security: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$SECURITY_RUN

          Review source changes and approve PR-specific checks. No production or hardware compatibility claim."

  report-failure:
    needs: [refresh, prepare, dispatch, validate, propose]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report a blocked refresh once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          title='Automated release snapshot refresh blocked'
          existing=$(gh issue list --state open --limit 100 --json title,author \
            --jq '[.[] | select(.title == "Automated release snapshot refresh blocked" and (.author.login == "app/github-actions" or .author.login == "github-actions"))] | length')
          if [[ "$existing" == 0 ]]; then
            gh issue create --title "$title" \
              --body "Review the failed refresh and retry after resolving the cause. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No production changes were made."
          fi
